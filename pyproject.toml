[project]
name = "lokam"
version = "0.1.0"
description = "A personal website and discovery platform for saved interests"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django[argon2]>=5.2,<5.3",
    "httpx>=0.28,<1",
    "pillow>=12,<13",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
