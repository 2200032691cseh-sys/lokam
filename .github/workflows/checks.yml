name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python scripts/check_docs.py
      - name: Audit locked runtime dependencies
        if: ${{ hashFiles('uv.lock') != '' }}
        run: |
          python -m pip install uv pip-audit
          uv export --locked --no-dev --no-hashes --no-emit-project --output-file "$RUNNER_TEMP/lokam-requirements.txt"
          python -m pip_audit --strict -r "$RUNNER_TEMP/lokam-requirements.txt"
